<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found | Store To Move</title>
  <meta name="theme-color" content="#1A1A1A" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --clr-charcoal: #1A1A1A;
      --clr-charcoal-2: #222222;
      --clr-orange: #FF6200;
      --clr-orange-lt: #FF7B1F;
      --clr-orange-dk: #E05500;
      --clr-white: #FFFFFF;
      --clr-text: #E0E0E0;
      --clr-muted: #9A9A9A;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.22);
      --line-faint: rgba(255, 255, 255, 0.04);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 12px;
      --radius-xl: 32px;
      --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background-color: var(--clr-charcoal);
      background-image:
        radial-gradient(ellipse 60% 55% at 15% 100%, rgba(255, 98, 0, 0.16), transparent 70%),
        linear-gradient(var(--line-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
      background-size: auto, 56px 56px, 56px 56px;
      color: var(--clr-text);
      font-family: var(--font-body);
      line-height: 1.6;
      text-align: center;
    }

    .card {
      position: relative;
      max-width: 560px;
      width: 100%;
      background: var(--clr-charcoal-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 52px 40px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--clr-orange-lt), var(--clr-orange), var(--clr-orange-dk));
    }

    .logo {
      height: 54px;
      width: auto;
      margin: 0 auto 28px;
      display: block;
    }

    .code {
      font-family: var(--font-heading);
      font-size: clamp(3.2rem, 9vw, 4.8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--clr-orange-lt), var(--clr-orange), var(--clr-orange-dk));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.55rem, 4vw, 2.05rem);
      font-weight: 800;
      color: var(--clr-white);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .lead {
      color: var(--clr-muted);
      font-size: 0.98rem;
      line-height: 1.75;
      max-width: 44ch;
      margin: 0 auto 32px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 13px 26px;
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--clr-orange-lt) 0%, var(--clr-orange) 60%, var(--clr-orange-dk) 100%);
      color: var(--clr-white);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-outline {
      background: transparent;
      color: var(--clr-white);
      border: 1.5px solid var(--line-strong);
    }

    .btn-outline:hover {
      border-color: var(--clr-orange);
      color: var(--clr-orange-lt);
      background: rgba(255, 98, 0, 0.06);
      transform: translateY(-2px);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--clr-muted);
      opacity: 0.75;
    }

    @media (max-width: 480px) {
      .card {
        padding: 38px 24px;
        border-radius: 22px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="STM_TextLogo.svg" alt="Store To Move" class="logo" />
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p class="lead">
      The page you’re looking for doesn’t exist or may have moved. Head back to the main page or reach out to our team directly.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="tel:+27711030540" class="btn btn-outline">Call 071 103 0540</a>
    </div>
  </main>
  <p class="footer-note">&copy; <span id="year"></span> Store To Move. All rights reserved.</p>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
